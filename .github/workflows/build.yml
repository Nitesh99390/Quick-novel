# Builds quicknovel-bot.jar on GitHub's servers (7 GB RAM) so the 1 GB VPS never has to compile.
#   wget -O quicknovel-bot.jar https://github.com/Nitesh99390/Quick-novel/releases/download/latest/quicknovel-bot.jar
name: Build fat jar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to create/update the "latest" release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAR_PATH: build/libs/quicknovel-bot.jar
  RELEASE_TAG: latest

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (with upstream/QuickNovel submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (dependency + wrapper cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Give the build more heap (runner has ~7 GB, gradle.properties is tuned for 1 GB)
        run: sed -i 's/-Xmx600m/-Xmx3g/; s/-XX:MaxMetaspaceSize=360m/-XX:MaxMetaspaceSize=1g/' gradle.properties

      - name: Make build script executable
        run: chmod +x ./build.sh ./gradlew

      - name: Build fat jar
        run: ./build.sh clean fatJar

      - name: Verify jar and write checksum
        run: |
          test -f "$JAR_PATH"
          ls -lh "$JAR_PATH"
          unzip -p "$JAR_PATH" META-INF/MANIFEST.MF | grep -q 'Main-Class'
          (cd build/libs && sha256sum quicknovel-bot.jar > quicknovel-bot.jar.sha256)
          cat build/libs/quicknovel-bot.jar.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quicknovel-bot-${{ github.sha }}
          path: |
            build/libs/quicknovel-bot.jar
            build/libs/quicknovel-bot.jar.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish to rolling "latest" pre-release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$RELEASE_TAG"
          NOTES="Automatic build of ${GITHUB_SHA::7} ($(date -u '+%Y-%m-%d %H:%M UTC'))."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --prerelease --title "Latest build (${GITHUB_SHA::7})" --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" --prerelease --title "Latest build (${GITHUB_SHA::7})" --notes "$NOTES"
          fi
          gh release upload "$RELEASE_TAG" build/libs/quicknovel-bot.jar build/libs/quicknovel-bot.jar.sha256 --clobber

# Tuned for small machines (~1 GB RAM): the Kotlin compiler runs inside the Gradle JVM.
# Bigger machines can raise -Xmx / MaxMetaspaceSize freely.
org.gradle.jvmargs=-Xmx600m -XX:MaxMetaspaceSize=360m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=64m -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon.performance.disable-logging=true
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
kotlin.code.style=official
